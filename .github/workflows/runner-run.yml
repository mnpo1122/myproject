name: Runner

# Schedule: daily 02:30 UTC (= 10:30 Asia/Shanghai).
# Chaining: the relay workflow triggers the next run only inside the
# 12:00-02:00+1 (Asia/Shanghai) window; outside it the chain stops and
# the next cron run starts a new chain.
# Boot order: install -> pre-init boot (schema only, then killed) ->
# FULL pool pull + FULL import into the database -> real start.
# The service never starts without a completed import.
# Exit sync runs on success AND failure (if: always()).
# Each run lasts a fixed 5.5h (RUN_DURATION=19800).
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-group
  cancel-in-progress: true

env:
  UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
  RUN_DURATION: 19800

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install service
        run: |
          npm install -g omniroute
          omniroute --version
          mkdir -p "$GITHUB_WORKSPACE/omni-data"

      - name: Pre-start database init
        run: |
          DATA_DIR="$GITHUB_WORKSPACE/omni-data"
          mkdir -p "$DATA_DIR"
          export DATA_DIR PORT=20128 HOSTNAME=0.0.0.0 NODE_ENV=production
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export API_KEY_SECRET="${{ secrets.API_KEY_SECRET }}"
          export INITIAL_PASSWORD="${{ secrets.INITIAL_PASSWORD }}"
          export OMNIROUTE_ENABLE_RUNTIME_BACKGROUND_TASKS=true
          export ENABLE_TLS_FINGERPRINT=true
          export OMNIROUTE_PUBLIC_BASE_URL="${{ secrets.OMNIROUTE_PUBLIC_BASE_URL }}"

          # temporary boot: only to let the service create its schema.
          # Killed as soon as storage.sqlite appears; the real start
          # happens after the full credential import below.
          nohup omniroute > /tmp/init.log 2>&1 &
          INIT_PID=$!
          OK=0
          for i in $(seq 1 36); do
            if [ -f "$DATA_DIR/storage.sqlite" ]; then
              OK=1
              break
            fi
            if ! kill -0 $INIT_PID 2>/dev/null; then
              echo "init process died early:"
              tail -n 50 /tmp/init.log || true
              break
            fi
            sleep 5
          done
          kill $INIT_PID 2>/dev/null || true
          pkill -f "omniroute" 2>/dev/null || true
          sleep 3
          rm -f "$DATA_DIR/storage.sqlite-wal" "$DATA_DIR/storage.sqlite-shm" 2>/dev/null || true
          if [ "$OK" != "1" ] || [ ! -f "$DATA_DIR/storage.sqlite" ]; then
            echo "database was not initialized — refusing to start without imported credentials"
            tail -n 100 /tmp/init.log || true
            exit 1
          fi
          echo "database initialized, init process stopped"

      - name: Restore session credentials
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: |
          python3 << 'PYEOF'
          import datetime, hashlib, json, os, re, sqlite3, sys, time
          import urllib.parse, urllib.request

          DATA_DIR = os.path.join(os.environ.get("GITHUB_WORKSPACE", os.getcwd()), "omni-data")
          DB = os.path.join(DATA_DIR, "storage.sqlite")

          # Remote storage REST derives from the redis:// URL secret (no redis-cli needed):
          #   redis://default:<token>@<host>:6379  ->  https://<host> + Bearer <token>
          def upstash_conf():
              url = (os.environ.get("UPSTASH_REDIS_URL") or "").strip()
              if url.startswith("redis://") or url.startswith("rediss://"):
                  m = re.match(r"^rediss?://([^:]+):([^@]+)@([^:/]+)", url)
                  if m:
                      return m.group(3), m.group(2)
              host = (os.environ.get("UPSTASH_REST_URL") or "").strip()
              tok = (os.environ.get("UPSTASH_REST_TOKEN") or "").strip()
              if host and tok:
                  return host.replace("https://", "").replace("/", ""), tok
              return None, None

          HOST, TOKEN = upstash_conf()
          if not HOST or not TOKEN:
              print("remote storage not configured — skip credential restore")
              sys.exit(0)

          def uget(path, tries=4):
              # Upstash REST rate-limits bursts — retry with backoff
              last = None
              for i in range(tries):
                  try:
                      time.sleep(0.15)
                      req = urllib.request.Request(
                          f"https://{HOST}{path}", headers={"Authorization": f"Bearer {TOKEN}"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode())["result"]
                  except Exception as e:
                      last = e
                      time.sleep(1.5 * (i + 1))
              raise last

          # bulk pipeline: one POST executes many commands at once
          def upipe(cmds, tries=4):
              body = json.dumps(cmds).encode()
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          f"https://{HOST}/pipeline", data=body,
                          headers={"Authorization": f"Bearer {TOKEN}",
                                   "Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return json.loads(r.read().decode())
                  except Exception as e:
                      last = e
                      time.sleep(1.5 * (i + 1))
              raise last

          # the database file is created by the pre-init boot step above
          for _ in range(12):
              if os.path.exists(DB):
                  break
              time.sleep(5)
          if not os.path.exists(DB):
              print("local database still missing after boot — skip credential restore")
              sys.exit(0)

          con = sqlite3.connect(DB)
          con.row_factory = sqlite3.Row

          # encodeChatGptWebCodexSecrets({cookie}) format. The request-time
          # executor reads ONLY api_key (401 when empty) — providerSpecificData
          # alone leaves connections recognized but unusable.
          def encoded_secrets(cookie):
              return json.dumps({"version": 2, "cookie": cookie}, ensure_ascii=False)

          def upsert(conn_id, name, email, cookie):
              now = datetime.datetime.now(datetime.timezone.utc).isoformat()
              psd = json.dumps({"cookie": cookie}, ensure_ascii=False)
              enc = encoded_secrets(cookie)
              cur = con.execute("SELECT id FROM provider_connections WHERE id=?", (conn_id,))
              row = cur.fetchone()
              if row:
                  con.execute(
                      "UPDATE provider_connections SET api_key=?, provider_specific_data=?, updated_at=? WHERE id=?",
                      (enc, psd, now, conn_id))
                  return "updated"
              cur = con.execute(
                  "SELECT id FROM provider_connections WHERE provider='chatgpt-web-codex' AND name=?",
                  (name,))
              row = cur.fetchone()
              if row:
                  con.execute(
                      "UPDATE provider_connections SET api_key=?, provider_specific_data=?, updated_at=? WHERE id=?",
                      (enc, psd, now, row["id"]))
                  return "updated"
              con.execute(
                  """INSERT INTO provider_connections
                     (id, provider, auth_type, name, email, is_active, api_key, provider_specific_data, created_at, updated_at)
                     VALUES (?,?,?,?,?,1,?,?,?,?)""",
                  (conn_id, "chatgpt-web-codex", "cookie", name, email, enc, psd, now, now))
              return "inserted"

          # pool cookies[] -> service cookie header.
          # - drop __Host-* names: the npm 3.8.50 storage-state builder forces
          #   a dot-domain on every cookie and CDP rejects __Host- cookies
          #   with a Domain set ("Invalid cookie fields" -> dead connections).
          # - drop values containing ';'/CTLs: they would corrupt the header
          #   split on the way in. Session material is base64url, unaffected.
          def header_from_cookies(arr):
              parts = []
              for c in arr or []:
                  if not isinstance(c, dict):
                      continue
                  n, v = c.get("name"), c.get("value")
                  if not n or not v:
                      continue
                  if n.startswith("__Host-"):
                      continue
                  if ";" in v or any(ord(ch) < 32 or ord(ch) == 127 for ch in v):
                      continue
                  parts.append(f"{n}={v}")
              return "; ".join(parts)

          def current_cookie(row):
              try:
                  psd = json.loads(row["provider_specific_data"] or "{}")
              except Exception:
                  return ""
              for k in ("cookie", "sessionToken", "session-token",
                        "__Secure-next-auth.session-token"):
                  v = psd.get(k)
                  if isinstance(v, str) and v.strip():
                      return v.strip()
              return ""

          def api_key_has_secrets(value):
              # enc:v1:… values were written by the app itself — trust them
              if not value or not isinstance(value, str) or not value.strip():
                  return False
              v = value.strip()
              if v.startswith("enc:v1:"):
                  return True
              try:
                  o = json.loads(v)
              except Exception:
                  return True  # raw cookie header — decodable by the executor
              return isinstance(o, dict) and bool(o.get("cookie") or o.get("storageState"))

          # FULL pull: every pool session in bulk, then FULL import below.
          # Any incomplete pull aborts with exit 1 — the service is only
          # started after a completed import (see boot order in the header).
          try:
              pool_keys = uget("/keys/chatgpt2api:session:*") or []
          except Exception as e:
              print(f"pool KEYS failed: {e}")
              pool_keys = []
          print(f"pool keys: {len(pool_keys)} — bulk pulling all sessions")
          sessions = {}
          complete = True
          for i in range(0, len(pool_keys), 100):
              chunk = pool_keys[i:i + 100]
              try:
                  resps = upipe([["GET", k] for k in chunk])
              except Exception as e:
                  print(f"  bulk GET chunk failed after retries, aborting: {e}")
                  complete = False
                  break
              for k, resp in zip(chunk, resps):
                  raw = (resp or {}).get("result")
                  if raw is None:
                      continue
                  try:
                      obj = json.loads(raw) if isinstance(raw, str) else raw
                  except Exception:
                      continue
                  if isinstance(obj, dict):
                      sessions[k] = obj
          print(f"bulk pulled {len(sessions)}/{len(pool_keys)} pool sessions")
          if not complete or (pool_keys and not sessions):
              print("pull incomplete — refusing to start without a complete import")
              sys.exit(1)

          # FULL import: every usable pool session becomes a local connection
          inserted, updated, skipped = 0, 0, 0
          for k, obj in sessions.items():
              email = (obj.get("email") or k.split(":")[-1] or "").strip()
              header = header_from_cookies(obj.get("cookies"))
              if not header or "@" not in email:
                  skipped += 1
                  continue
              slug = re.sub(r"[^A-Za-z0-9]+", "-", email).strip("-")[:40] or hashlib.sha1(
                  header.encode()).hexdigest()[:12]
              cid = f"codex-upstash-{slug}"
              cur = con.execute(
                  "SELECT api_key, provider_specific_data FROM provider_connections WHERE id=?",
                  (cid,))
              ex = cur.fetchone()
              if ex is None:
                  # same account under another id (e.g. dashboard-created) -> reuse it
                  cur = con.execute(
                      "SELECT id, api_key, provider_specific_data FROM provider_connections "
                      "WHERE provider='chatgpt-web-codex' AND name=?", (email,))
                  ex2 = cur.fetchone()
                  if ex2 is not None:
                      cid, ex = ex2["id"], ex2
              if ex is None:
                  upsert(cid, email, email, header)
                  inserted += 1
              else:
                  fake = {"provider_specific_data": ex["provider_specific_data"]}
                  if header != current_cookie(fake) or not api_key_has_secrets(ex["api_key"]):
                      upsert(cid, email, email, header)
                      updated += 1
          con.commit()
          con.close()
          print(f"full import done: pulled={len(sessions)} inserted={inserted} updated={updated} skipped={skipped}")
          PYEOF

      - name: Start service
        id: start
        run: |
          DATA_DIR="$GITHUB_WORKSPACE/omni-data"
          mkdir -p "$DATA_DIR"
          export DATA_DIR PORT=20128 HOSTNAME=0.0.0.0 NODE_ENV=production
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export API_KEY_SECRET="${{ secrets.API_KEY_SECRET }}"
          export INITIAL_PASSWORD="${{ secrets.INITIAL_PASSWORD }}"
          export OMNIROUTE_ENABLE_RUNTIME_BACKGROUND_TASKS=true
          export ENABLE_TLS_FINGERPRINT=true
          export OMNIROUTE_PUBLIC_BASE_URL="${{ secrets.OMNIROUTE_PUBLIC_BASE_URL }}"

          # real start: runs only after the full credential import above
          nohup omniroute > /tmp/app.log 2>&1 &
          APP_PID=$!
          echo "pid=$APP_PID" >> $GITHUB_OUTPUT

          sleep 8
          READY=0
          for i in $(seq 1 15); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' http://localhost:20128/ --max-time 5 2>/dev/null || echo 000)
            echo "boot probe $i: HTTP $CODE"
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" = "1" ] && [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 500 ] 2>/dev/null; then
            echo "Service ready (HTTP $CODE)"
          else
            echo "Service responded with HTTP ${CODE:-none}"
            tail -n 100 /tmp/app.log || true
          fi

      - name: Setup tunnel
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /dev/null 2>&1 &
          echo "$!" > /tmp/cloudflared.pid
          sleep 5
          echo "Tunnel started"

      - name: Verify connectivity
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' "http://localhost:20128/" --max-time 10 2>/dev/null)
            echo "Health check $i: HTTP $CODE"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ] 2>/dev/null; then
              echo "Service is accessible"
              exit 0
            fi
            sleep 5
          done
          echo "=== tail of service log ==="
          tail -n 50 /tmp/app.log || true

      - name: Keep alive + watchdog
        run: |
          END=$((SECONDS + ${{ env.RUN_DURATION }}))

          while [ $SECONDS -lt $END ]; do
            # tunnel health
            CF_PID=$(cat /tmp/cloudflared.pid 2>/dev/null || echo 0)
            if [ "$CF_PID" -gt 0 ] && ! kill -0 $CF_PID 2>/dev/null; then
              echo "[$(date)] tunnel died, restarting..."
              nohup cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /dev/null 2>&1 &
              echo "$!" > /tmp/cloudflared.pid
              sleep 3
            fi

            # service health
            if ! kill -0 ${{ steps.start.outputs.pid }} 2>/dev/null; then
              if ! pgrep -f "omniroute" >/dev/null 2>&1; then
                echo "[$(date)] service died, restarting..."
                tail -n 30 /tmp/app.log || true
                export DATA_DIR="$GITHUB_WORKSPACE/omni-data" PORT=20128 HOSTNAME=0.0.0.0 NODE_ENV=production
                export JWT_SECRET="${{ secrets.JWT_SECRET }}"
                export API_KEY_SECRET="${{ secrets.API_KEY_SECRET }}"
                export INITIAL_PASSWORD="${{ secrets.INITIAL_PASSWORD }}"
                export OMNIROUTE_ENABLE_RUNTIME_BACKGROUND_TASKS=true
                export ENABLE_TLS_FINGERPRINT=true
                export OMNIROUTE_PUBLIC_BASE_URL="${{ secrets.OMNIROUTE_PUBLIC_BASE_URL }}"

                nohup omniroute > /tmp/app.log 2>&1 &
                echo "pid=$!" >> $GITHUB_OUTPUT
                sleep 8
              fi
            fi

            REMAINING=$((END - SECONDS))
            echo "[$(date)] remaining: $((REMAINING/3600))h $(((REMAINING%3600)/60))m"
            sleep 30
          done

      - name: Sync session credentials
        if: always()
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: |
          python3 << 'PYEOF'
          import datetime, hashlib, json, os, re, sqlite3, sys, time
          import urllib.parse, urllib.request

          DATA_DIR = os.path.join(os.environ.get("GITHUB_WORKSPACE", os.getcwd()), "omni-data")
          DB = os.path.join(DATA_DIR, "storage.sqlite")

          def upstash_conf():
              url = (os.environ.get("UPSTASH_REDIS_URL") or "").strip()
              if url.startswith("redis://") or url.startswith("rediss://"):
                  m = re.match(r"^rediss?://([^:]+):([^@]+)@([^:/]+)", url)
                  if m:
                      return m.group(3), m.group(2)
              return None, None

          HOST, TOKEN = upstash_conf()
          if not HOST or not TOKEN:
              print("remote storage not configured — skip credential sync")
              sys.exit(0)
          if not os.path.exists(DB):
              print("local database missing — nothing to sync")
              sys.exit(0)

          def uget(path, tries=4):
              # Upstash REST rate-limits bursts — retry with backoff
              last = None
              for i in range(tries):
                  try:
                      time.sleep(0.15)
                      req = urllib.request.Request(
                          f"https://{HOST}{path}", headers={"Authorization": f"Bearer {TOKEN}"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode())["result"]
                  except Exception as e:
                      last = e
                      time.sleep(1.5 * (i + 1))
              raise last

          # bulk pipeline: one POST executes many commands at once
          def upipe(cmds, tries=4):
              body = json.dumps(cmds).encode()
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          f"https://{HOST}/pipeline", data=body,
                          headers={"Authorization": f"Bearer {TOKEN}",
                                   "Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=180) as r:
                          return json.loads(r.read().decode())
                  except Exception as e:
                      last = e
                      time.sleep(1.5 * (i + 1))
              raise last

          # service cookie header -> pool cookies[].
          # Same-name entries keep their stored metadata, only value is refreshed;
          # other pool fields are preserved, never overwritten.
          def parse_header(header):
              pairs = []
              for part in (header or "").split(";"):
                  part = part.strip()
                  if not part or "=" not in part:
                      continue
                  n, v = part.split("=", 1)
                  n, v = n.strip(), v.strip()
                  if n and v:
                      pairs.append((n, v))
              return pairs

          # MERGE, never replace: pool-only entries (csrf-token, other
          # domains' cookies) survive our sync-back untouched; names present
          # in our header get fresh values with their stored metadata kept.
          def translate_to_pool(email, pairs, existing, now):
              new_vals = {}
              for n, v in pairs:
                  new_vals[n] = v
              arr = []
              seen = set()
              if isinstance(existing, dict):
                  for c in existing.get("cookies") or []:
                      if not isinstance(c, dict) or not c.get("name"):
                          continue
                      n = c["name"]
                      if n in new_vals:
                          c = dict(c)
                          c["value"] = new_vals[n]
                          seen.add(n)
                      arr.append(c)
              for n, v in pairs:
                  if n not in seen:
                      seen.add(n)
                      arr.append({
                          "name": n,
                          "value": v,
                          "domain": ".chatgpt.com",
                          "path": "/",
                          "secure": True if n.startswith(
                              ("__Secure-", "__Host-")) else False,
                          "httpOnly": False,
                      })
              if isinstance(existing, dict):
                  existing["cookies"] = arr
                  existing["updated_at"] = now
                  if not existing.get("email"):
                      existing["email"] = email
                  existing["last_synced_by"] = "omniroute-runner"
                  existing["last_sync_at"] = now
                  return existing
              return {
                  "email": email,
                  "access": "",
                  "cookies": arr,
                  "user_id": "",
                  "plan_type": "",
                  "expires_at": "",
                  "source": "omniroute-runner",
                  "updated_at": now,
                  "storage_state": None,
                  "sync_version": 7,
                  "last_synced_by": "omniroute-runner",
                  "last_sync_at": now,
              }

          con = sqlite3.connect(DB)
          con.row_factory = sqlite3.Row
          try:
              rows = con.execute(
                  "SELECT id, name, email, api_key, provider_specific_data FROM provider_connections "
                  "WHERE provider='chatgpt-web-codex'").fetchall()
          except Exception as e:
              print(f"query failed: {e}")
              rows = []

          def live_header(conn_id):
              # browser storage state refreshed by the runtime during the run —
              # the freshest cookies; falls back to the database copy
              try:
                  seg = hashlib.sha256(conn_id.encode()).hexdigest()[:32]
                  p = os.path.join(DATA_DIR, "chatgpt-web-codex", "connections",
                                   seg, "storage-state.json")
                  with open(p, encoding="utf-8") as f:
                      st = json.load(f)
                  parts = []
                  for c in st.get("cookies") or []:
                      if isinstance(c, dict) and c.get("name") and c.get("value"):
                          parts.append(f"{c['name']}={c['value']}")
                  return "; ".join(parts)
              except Exception:
                  return ""

          # resolve all cookies locally first (zero network), then ONE bulk
          # pull for metadata preservation + ONE bulk upload
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          jobs = []  # (email, pairs, src)
          for r in rows:
              cid = r["id"]
              email = ((r["email"] or "").strip() or (r["name"] or "").strip())
              if "@" not in email:
                  continue
              cookie, src = live_header(cid), "live-storage"
              if not cookie:
                  try:
                      psd = json.loads(r["provider_specific_data"] or "{}")
                  except Exception:
                      psd = {}
                  for k in ("cookie", "sessionToken", "session-token",
                            "__Secure-next-auth.session-token"):
                      v = (psd.get(k) or "").strip() if isinstance(psd.get(k), str) else ""
                      if v:
                          cookie, src = v, "db"
                          break
              if not cookie:
                  # dashboard-created rows keep the secret in api_key
                  raw_key = (r["api_key"] or "").strip()
                  if raw_key.startswith("{"):
                      try:
                          cookie = (json.loads(raw_key).get("cookie") or "").strip()
                          src = "apikey"
                      except Exception:
                          cookie = ""
              pairs = parse_header(cookie)
              if pairs:
                  jobs.append((email, pairs, src))
          print(f"upload jobs: {len(jobs)}/{len(rows)}")

          skeys = [f"chatgpt2api:session:{em}" for em, _, _ in jobs]
          existing_map = {}
          for i in range(0, len(skeys), 100):
              chunk = skeys[i:i + 100]
              try:
                  resps = upipe([["GET", k] for k in chunk])
              except Exception as e:
                  print(f"  bulk pool GET failed: {e}")
                  continue
              for k, resp in zip(chunk, resps):
                  raw = (resp or {}).get("result")
                  if raw is None:
                      existing_map[k] = None
                      continue
                  try:
                      existing_map[k] = json.loads(raw) if isinstance(raw, str) else raw
                  except Exception:
                      existing_map[k] = None

          cmds, order = [], []
          for (email, pairs, src), key in zip(jobs, skeys):
              payload = json.dumps(
                  translate_to_pool(email, pairs, existing_map.get(key), now),
                  ensure_ascii=False)
              cmds.append(["SET", key, payload])
              order.append((email, len(pairs), src))
          pushed = 0
          for i in range(0, len(cmds), 25):
              try:
                  resps = upipe(cmds[i:i + 25])
              except Exception as e:
                  print(f"  bulk pool SET failed: {e}")
                  continue
              for (email, n, src), resp in zip(order[i:i + 25], resps):
                  if (resp or {}).get("error"):
                      print(f"  pool SET error: {str((resp or {}).get('error'))[:120]}")
                  else:
                      pushed += 1
                      print(f"  synced account cookies={n} via={src}")
          skipped = len(rows) - len(jobs)

          con.close()
          print(f"credential sync done: pushed={pushed} skipped={skipped}")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(f"\n### Session credential sync\n- pushed: {pushed}\n- skipped: {skipped}\n")
          PYEOF

      - name: Stop service
        if: always()
        run: |
          kill ${{ steps.start.outputs.pid }} 2>/dev/null || true
          pkill -f "omniroute" 2>/dev/null || true
          sleep 3
          echo "Done"
