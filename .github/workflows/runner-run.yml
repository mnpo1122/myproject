name: Runner

# Schedule: daily 02:30 UTC (= 10:30 Asia/Shanghai).
# Chaining: the relay workflow triggers the next run only inside the
# 12:00-02:00+1 (Asia/Shanghai) window; outside it the chain stops and
# the next cron run starts a new chain.
# Each run lasts a fixed 5.5h (RUN_DURATION=19800).
# The service is chatgpt2api (private GHCR image). Upstash is the
# authority for account credentials: boot does a full cloud import
# (the app itself syncs on lifespan), exit needs no separate sync step
# because every credential mutation is written through during the run.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: run-group
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mnpo1122/chatgpt2api:v3.2.4
  RUN_DURATION: 19800

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start FlareSolverr
        run: |
          docker run -d --name flaresolverr \
            --restart unless-stopped \
            -e LOG_LEVEL=warning \
            ghcr.io/flaresolverr/flaresolverr:latest
          OK=0
          for i in $(seq 1 30); do
            CODE=$(docker inspect -f '{{.State.Running}}' flaresolverr 2>/dev/null || echo false)
            echo "flaresolverr probe $i: running=$CODE"
            if [ "$CODE" = "true" ]; then
              OK=1
              break
            fi
            sleep 5
          done
          [ "$OK" = "1" ] && echo "FlareSolverr ready" || echo "FlareSolverr did not come up — clearance falls back to manual"

      - name: Start service
        id: start
        run: |
          mkdir -p "$GITHUB_WORKSPACE/data"
          docker run -d --name chatgpt2api \
            --restart unless-stopped \
            -p 20128:80 \
            -v "$GITHUB_WORKSPACE/data:/app/data" \
            -e CHATGPT2API_AUTH_KEY="${{ secrets.CHATGPT2API_AUTH_KEY }}" \
            -e UPSTASH_REDIS_URL="${{ secrets.UPSTASH_REDIS_URL }}" \
            -e UPSTASH_SYNC_ENABLED=true \
            -e TZ=Asia/Shanghai \
            "$IMAGE"
          sleep 10
          READY=0
          for i in $(seq 1 15); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' http://localhost:20128/ --max-time 5 2>/dev/null || echo 000)
            echo "boot probe $i: HTTP $CODE"
            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              READY=1
              break
            fi
            sleep 5
          done
          if [ "$READY" = "1" ]; then
            echo "Service ready (HTTP $CODE)"
          else
            echo "Service did not respond"
            docker logs --tail 100 chatgpt2api || true
          fi
          echo "=== boot sync ==="
          docker logs chatgpt2api 2>&1 | grep -i "upstash_boot_sync" | tail -n 3 || echo "(no boot sync line yet)"

      - name: Setup tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate run --token "${{ secrets.CF_TUNNEL_TOKEN }}" > /dev/null 2>&1 &
          echo "$!" > /tmp/cloudflared.pid
          sleep 5
          echo "Tunnel started"

      - name: Verify connectivity
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' "http://localhost:20128/v1/models" \
              -H "Authorization: Bearer ${{ secrets.CHATGPT2API_AUTH_KEY }}" --max-time 10 2>/dev/null)
            echo "Health check $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "API is accessible"
              exit 0
            fi
            sleep 5
          done
          echo "=== tail of service log ==="
          docker logs --tail 50 chatgpt2api || true

      - name: Keep alive + watchdog
        run: |
          END=$((SECONDS + ${{ env.RUN_DURATION }}))
          while [ $SECONDS -lt $END ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' chatgpt2api 2>/dev/null)" != "true" ]; then
              echo "[$(date)] service container stopped, restarting..."
              docker start chatgpt2api 2>/dev/null || true
              sleep 10
            fi
            CF_PID=$(cat /tmp/cloudflared.pid 2>/dev/null || echo 0)
            if [ "$CF_PID" -gt 0 ] && ! kill -0 $CF_PID 2>/dev/null; then
              echo "[$(date)] tunnel died, restarting..."
              nohup cloudflared tunnel --no-autoupdate run --token "${{ secrets.CF_TUNNEL_TOKEN }}" > /dev/null 2>&1 &
              echo "$!" > /tmp/cloudflared.pid
              sleep 3
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' flaresolverr 2>/dev/null)" != "true" ]; then
              echo "[$(date)] flaresolverr stopped, restarting..."
              docker start flaresolverr 2>/dev/null || true
            fi
            REMAINING=$((END - SECONDS))
            echo "[$(date)] remaining: $((REMAINING/3600))h $(((REMAINING%3600)/60))m"
            sleep 60
          done

      - name: Final write-through drain + stop
        if: always()
        run: |
          echo "=== final sync state ==="
          docker logs chatgpt2api 2>&1 | grep -i "upstash_write_back" | tail -n 5 || echo "(no write-back lines)"
          docker stop chatgpt2api flaresolverr 2>/dev/null || true
          kill "$(cat /tmp/cloudflared.pid 2>/dev/null)" 2>/dev/null || true
          echo "Done"
